name: Build APK

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Download and extract Gradle to get wrapper jar
      run: |
        GRADLE_VERSION="8.7"
        GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
        echo "Downloading Gradle ${GRADLE_VERSION}..."
        curl -L "$GRADLE_URL" -o /tmp/gradle.zip
        echo "Extracting Gradle..."
        unzip -q /tmp/gradle.zip -d /tmp/
        echo "Copying gradle-wrapper.jar to project..."
        mkdir -p gradle/wrapper
        cp /tmp/gradle-${GRADLE_VERSION}/lib/gradle-launcher-${GRADLE_VERSION}.jar gradle/wrapper/gradle-wrapper.jar
        echo "Wrapper jar created successfully!"
        ls -la gradle/wrapper/

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-backup-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
